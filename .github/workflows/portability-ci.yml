name: Portability CI

on:
  push:
    branches:
      - feature/windows-portability
      - feature/runtime-configuration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BESLE_MAX_STEPS: "1"
  BESLE_PORTABILITY_BASELINE: "78be7d93d60b85d8a66066f9b40c610461eb0b09"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  linux-reference:
    name: Linux reference and runtime configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran ninja-build \
            openmpi-bin libopenmpi-dev \
            libmumps-dev libscalapack-openmpi-dev \
            libopenblas-dev liblapack-dev

      - name: Configure current version
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=mpifort

      - name: Build current version once
        run: cmake --build build --parallel 2

      - name: Run default auxiliary configurations
        run: |
          mkdir -p validation/auxiliary-current
          cp -a BESLE_ROOT/Material validation/auxiliary-current/material
          cp -a BESLE_ROOT/Mesh/General validation/auxiliary-current/general
          cp -a BESLE_ROOT/Mesh/Polycrystal validation/auxiliary-current/polycrystal

          (
            cd validation/auxiliary-current/material
            BESLE_MATERIAL_CONFIG_FILE="$PWD/Material.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-Material"
          )
          mkdir -p validation/auxiliary-current/general/Meshes/DAT \
            validation/auxiliary-current/general/BCs/BCs_DAT
          (
            cd validation/auxiliary-current/general
            BESLE_GENERAL_CONFIG_FILE="$PWD/General.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-General"
          )
          mkdir -p validation/auxiliary-current/polycrystal/IO_files \
            validation/auxiliary-current/polycrystal/Export
          (
            cd validation/auxiliary-current/polycrystal
            BESLE_POLYCRYSTAL_CONFIG_FILE="$PWD/Polycrystal.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-Polycrystal-Structure"
            "$GITHUB_WORKSPACE/build/bin/BESLE-Polycrystal-Mesh"
          )

          mkdir -p validation/auxiliary-default/material \
            validation/auxiliary-default/general \
            validation/auxiliary-default/polycrystal
          cp validation/auxiliary-current/material/Data/Isotropic/Material_9.dat \
            validation/auxiliary-default/material/
          cp validation/auxiliary-current/general/Meshes/DAT/Input_data.dat \
            validation/auxiliary-current/general/BCs/BCs_DAT/BCs_*.dat \
            validation/auxiliary-default/general/
          cp validation/auxiliary-current/polycrystal/Export/Mesh.dat \
            validation/auxiliary-current/polycrystal/Export/Mesh.vtk \
            validation/auxiliary-default/polycrystal/

      - name: Run default external configuration
        working-directory: BESLE_ROOT
        run: |
          rm -rf Results OOC
          mkdir -p Results OOC ../validation/default-results
          mpiexec -n 2 ../build/bin/BESLE
          cp Results/*.vtk ../validation/default-results/

      - name: Build published-code baseline
        run: |
          git worktree add baseline "$BESLE_PORTABILITY_BASELINE"
          cmake -S baseline -B baseline/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=mpifort
          cmake --build baseline/build --parallel 2

      - name: Build and run published auxiliary baseline
        run: |
          mkdir -p validation/baseline-bin \
            validation/baseline-modules/material \
            validation/baseline-modules/general
          gfortran -O0 -fimplicit-none -fno-range-check -fallow-argument-mismatch \
            -Jvalidation/baseline-modules/material \
            baseline/BESLE_ROOT/Material/src/Global_variables.f90 \
            baseline/BESLE_ROOT/Material/src/Set_parameters.f90 \
            baseline/BESLE_ROOT/Material/src/Fourier_Coefficient.f90 \
            baseline/BESLE_ROOT/Material/src/Output_data.f90 \
            baseline/BESLE_ROOT/Material/src/F_Coeff.f90 \
            -lblas -llapack -o validation/baseline-bin/BESLE-Material
          gfortran -O0 -fimplicit-none -fno-range-check -fallow-argument-mismatch \
            -Jvalidation/baseline-modules/general \
            baseline/BESLE_ROOT/Mesh/General/src/Global_variables.f90 \
            baseline/BESLE_ROOT/Mesh/General/src/Set_parameters.f90 \
            baseline/BESLE_ROOT/Mesh/General/src/Custom_functions.f90 \
            baseline/BESLE_ROOT/Mesh/General/src/Mesh_BCs.f90 \
            baseline/BESLE_ROOT/Mesh/General/src/Mesh.f90 \
            -lblas -llapack -o validation/baseline-bin/BESLE-General

          voro_library=$(find build -name 'libbesle_voro.a' -print -quit)
          triangle_library=$(find build -name 'libbesle_triangle.a' -print -quit)
          voro_source=$(find build/_deps -maxdepth 1 -type d -name 'voro-src' -print -quit)
          triangle_source=$(find build/_deps -maxdepth 1 -type d -name 'triangle-src' -print -quit)
          test -f "$voro_library"
          test -f "$triangle_library"
          test -d "$voro_source"
          test -d "$triangle_source"

          g++ -Wall -ansi -pedantic -O3 -Wformat \
            -Ibaseline/BESLE_ROOT/Mesh/Polycrystal/include \
            -Ibaseline/BESLE_ROOT/Mesh/Polycrystal/src \
            -I"$voro_source/src" \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Mesh_Generator.cc \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Set_parameters.cc \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Polycrystalline_Material.cc \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Input_data.cc \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Ouput_data.cc \
            "$voro_library" -o validation/baseline-bin/BESLE-Polycrystal-Structure
          gcc -std=gnu99 \
            -Ibaseline/BESLE_ROOT/Mesh/Polycrystal/src \
            -I"$triangle_source" \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Main2.c \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Input_data_mesh.c \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/2D_Data.c \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/transf_coordinates.c \
            baseline/BESLE_ROOT/Mesh/Polycrystal/src/Output_data.c \
            "$triangle_library" -lm -o validation/baseline-bin/BESLE-Polycrystal-Mesh

          mkdir -p validation/auxiliary-baseline
          cp -a baseline/BESLE_ROOT/Material \
            validation/auxiliary-baseline/material
          cp -a baseline/BESLE_ROOT/Mesh/General \
            validation/auxiliary-baseline/general
          cp -a baseline/BESLE_ROOT/Mesh/Polycrystal \
            validation/auxiliary-baseline/polycrystal

          (
            cd validation/auxiliary-baseline/material
            "$GITHUB_WORKSPACE/validation/baseline-bin/BESLE-Material"
          )
          mkdir -p validation/auxiliary-baseline/general/Meshes/DAT \
            validation/auxiliary-baseline/general/BCs/BCs_DAT
          (
            cd validation/auxiliary-baseline/general
            "$GITHUB_WORKSPACE/validation/baseline-bin/BESLE-General"
          )
          mkdir -p validation/auxiliary-baseline/polycrystal/IO_files \
            validation/auxiliary-baseline/polycrystal/Export
          (
            cd validation/auxiliary-baseline/polycrystal
            "$GITHUB_WORKSPACE/validation/baseline-bin/BESLE-Polycrystal-Structure"
            "$GITHUB_WORKSPACE/validation/baseline-bin/BESLE-Polycrystal-Mesh"
          )

      - name: Verify auxiliary defaults against published code
        run: |
          cmp validation/auxiliary-baseline/material/Data/Isotropic/Material_9.dat \
            validation/auxiliary-default/material/Material_9.dat
          cmp validation/auxiliary-baseline/general/Meshes/DAT/Input_data.dat \
            validation/auxiliary-default/general/Input_data.dat
          cmp validation/auxiliary-baseline/general/BCs/BCs_DAT/BCs_1.dat \
            validation/auxiliary-default/general/BCs_1.dat
          cmp validation/auxiliary-baseline/general/BCs/BCs_DAT/BCs_2.dat \
            validation/auxiliary-default/general/BCs_2.dat
          cmp validation/auxiliary-baseline/polycrystal/Export/Mesh.dat \
            validation/auxiliary-default/polycrystal/Mesh.dat
          cmp validation/auxiliary-baseline/polycrystal/Export/Mesh.vtk \
            validation/auxiliary-default/polycrystal/Mesh.vtk

      - name: Change every auxiliary configuration without rebuilding
        run: |
          sed -i 's/2.0000000000000000d5/1.0000000000000000d5/' \
            validation/auxiliary-current/material/Material.nml
          (
            cd validation/auxiliary-current/material
            BESLE_MATERIAL_CONFIG_FILE="$PWD/Material.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-Material"
          )
          if cmp -s validation/auxiliary-default/material/Material_9.dat \
            validation/auxiliary-current/material/Data/Isotropic/Material_9.dat; then
            echo "Changing Material.nml did not change Material_9.dat." >&2
            exit 1
          fi

          sed -i 's/1.0d2/5.0d1/g' validation/auxiliary-current/general/General.nml
          rm -rf validation/auxiliary-current/general/Meshes/DAT \
            validation/auxiliary-current/general/BCs/BCs_DAT
          mkdir -p validation/auxiliary-current/general/Meshes/DAT \
            validation/auxiliary-current/general/BCs/BCs_DAT
          (
            cd validation/auxiliary-current/general
            BESLE_GENERAL_CONFIG_FILE="$PWD/General.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-General"
          )
          if cmp -s validation/auxiliary-default/general/BCs_2.dat \
            validation/auxiliary-current/general/BCs/BCs_DAT/BCs_2.dat; then
            echo "Changing General.nml did not change BCs_2.dat." >&2
            exit 1
          fi

          sed -i 's/ngrains_x = 3/ngrains_x = 2/' \
            validation/auxiliary-current/polycrystal/Polycrystal.nml
          sed -i 's/ngrains_y = 4/ngrains_y = 1/' \
            validation/auxiliary-current/polycrystal/Polycrystal.nml
          sed -i 's/ngrains_z = 8/ngrains_z = 1/' \
            validation/auxiliary-current/polycrystal/Polycrystal.nml
          rm -rf validation/auxiliary-current/polycrystal/IO_files \
            validation/auxiliary-current/polycrystal/Export
          mkdir -p validation/auxiliary-current/polycrystal/IO_files \
            validation/auxiliary-current/polycrystal/Export
          (
            cd validation/auxiliary-current/polycrystal
            BESLE_POLYCRYSTAL_CONFIG_FILE="$PWD/Polycrystal.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-Polycrystal-Structure"
            "$GITHUB_WORKSPACE/build/bin/BESLE-Polycrystal-Mesh"
          )
          if cmp -s validation/auxiliary-default/polycrystal/Mesh.dat \
            validation/auxiliary-current/polycrystal/Export/Mesh.dat; then
            echo "Changing Polycrystal.nml did not change Mesh.dat." >&2
            exit 1
          fi

      - name: Reject invalid auxiliary configurations
        run: |
          cp validation/auxiliary-current/material/Material.nml validation/invalid-material.nml
          sed -i 's/nu = 0.0000000000000000d0/nu = 6.0d-1/' validation/invalid-material.nml
          set +e
          (
            cd validation/auxiliary-current/material
            BESLE_MATERIAL_CONFIG_FILE="$GITHUB_WORKSPACE/validation/invalid-material.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-Material"
          ) > validation/invalid-material.log 2>&1
          material_status=$?

          cp validation/auxiliary-current/general/General.nml validation/invalid-general.nml
          sed -i "s/AnalysisType = 'quasi-elastostatic'/AnalysisType = 'invalid'/" \
            validation/invalid-general.nml
          (
            cd validation/auxiliary-current/general
            BESLE_GENERAL_CONFIG_FILE="$GITHUB_WORKSPACE/validation/invalid-general.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-General"
          ) > validation/invalid-general.log 2>&1
          general_status=$?

          cp validation/auxiliary-current/polycrystal/Polycrystal.nml validation/invalid-polycrystal.nml
          sed -i 's/dm = 1/dm = 0/' validation/invalid-polycrystal.nml
          (
            cd validation/auxiliary-current/polycrystal
            BESLE_POLYCRYSTAL_CONFIG_FILE="$GITHUB_WORKSPACE/validation/invalid-polycrystal.nml" \
              "$GITHUB_WORKSPACE/build/bin/BESLE-Polycrystal-Structure"
          ) > validation/invalid-polycrystal.log 2>&1
          polycrystal_status=$?
          set -e

          test "$material_status" -ne 0
          test "$general_status" -ne 0
          test "$polycrystal_status" -ne 0
          grep -q 'ERROR DE CONFIGURACION MATERIAL' validation/invalid-material.log
          grep -q 'ERROR DE CONFIGURACION GENERAL' validation/invalid-general.log
          grep -q 'ERROR DE CONFIGURACION POLYCRYSTAL' validation/invalid-polycrystal.log

      - name: Verify default configuration against baseline
        run: |
          rm -rf baseline/BESLE_ROOT/Results baseline/BESLE_ROOT/OOC
          mkdir -p baseline/BESLE_ROOT/Results baseline/BESLE_ROOT/OOC
          (
            cd baseline/BESLE_ROOT
            mpiexec -n 2 ../build/bin/BESLE
          )
          python tools/compare_vtk.py \
            baseline/BESLE_ROOT/Results \
            validation/default-results \
            --rtol 0 \
            --atol 0 \
            --max-relative-l2 0 \
            --report validation/default-regression.json

      - name: Change load without rebuilding
        run: |
          rm -rf validation/modified-project
          mkdir -p validation/modified-project/Results validation/modified-project/OOC
          cp -r BESLE_ROOT/Body_forces BESLE_ROOT/Cracks BESLE_ROOT/Material \
            BESLE_ROOT/Mesh validation/modified-project/
          cp BESLE_ROOT/BESLE.nml validation/modified-project/BESLE.nml
          sed -i 's/1.0000000000000000d8/5.0000000000000000d7/' \
            validation/modified-project/BESLE.nml
          grep -q '5.0000000000000000d7' validation/modified-project/BESLE.nml
          (
            cd validation/modified-project
            BESLE_CONFIG_FILE="$PWD/BESLE.nml" mpiexec -n 2 ../../build/bin/BESLE
          )
          if cmp -s validation/default-results/Results_1.vtk \
            validation/modified-project/Results/Results_1.vtk; then
            echo "Changing BESLE.nml did not change the numerical result." >&2
            exit 1
          fi

      - name: Reject an invalid external configuration
        run: |
          rm -rf validation/invalid-project
          cp -r validation/modified-project validation/invalid-project
          rm -rf validation/invalid-project/Results validation/invalid-project/OOC
          mkdir -p validation/invalid-project/Results validation/invalid-project/OOC
          sed -i 's/dt = 9.9999999747524271d-7/dt = -1.0d-6/' \
            validation/invalid-project/BESLE.nml
          set +e
          (
            cd validation/invalid-project
            BESLE_CONFIG_FILE="$PWD/BESLE.nml" mpiexec -n 2 ../../build/bin/BESLE
          ) > validation/invalid-config.log 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "BESLE accepted an invalid negative time step." >&2
            exit 1
          fi
          grep -q 'ERROR DE CONFIGURACION BESLE' validation/invalid-config.log

      - name: Record Linux environment
        run: |
          gfortran --version > validation/environment-linux.txt
          cmake --version >> validation/environment-linux.txt
          mpiexec --version >> validation/environment-linux.txt
          dpkg-query -W gfortran openmpi-bin libopenmpi-dev libmumps-dev \
            libscalapack-openmpi-dev libopenblas-dev >> validation/environment-linux.txt

      - name: Upload Linux default reference
        uses: actions/upload-artifact@v4
        with:
          name: linux-reference-vtk
          path: validation/default-results/**/*.vtk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux modified reference
        uses: actions/upload-artifact@v4
        with:
          name: linux-modified-vtk
          path: validation/modified-project/Results/**/*.vtk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-configuration-evidence
          path: |
            validation/default-regression.json
            validation/modified-project/BESLE.nml
            validation/invalid-config.log
            validation/environment-linux.txt
            validation/auxiliary-default/
            validation/auxiliary-current/material/Material.nml
            validation/auxiliary-current/material/Data/Isotropic/Material_9.dat
            validation/auxiliary-current/general/General.nml
            validation/auxiliary-current/general/Meshes/DAT/
            validation/auxiliary-current/general/BCs/BCs_DAT/
            validation/auxiliary-current/polycrystal/Polycrystal.nml
            validation/auxiliary-current/polycrystal/Export/
            validation/invalid-material.log
            validation/invalid-general.log
            validation/invalid-polycrystal.log
          if-no-files-found: warn
          retention-days: 14

  windows-native:
    name: Windows native and equivalence
    needs: linux-reference
    runs-on: windows-2022
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Install Microsoft MPI runtime
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/a/5/2/a5207ca5-1203-491a-8fb8-906fd68ae623/msmpisetup.exe"
          $destination = Join-Path $env:RUNNER_TEMP "msmpisetup.exe"
          $expected = "C305CE3F05D142D519F8DD800D83A4B894FC31BCAD30512CEFB557FEACCBE8B4"
          Invoke-WebRequest -Uri $url -OutFile $destination
          $actual = (Get-FileHash -Path $destination -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Unexpected Microsoft MPI installer hash: $actual"
          }
          $process = Start-Process -FilePath $destination -ArgumentList "-unattend" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Microsoft MPI installation failed with exit code $($process.ExitCode)"
          }

      - name: Install UCRT64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            python
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-msmpi
            mingw-w64-ucrt-x86_64-mumps
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=/ucrt64/bin/mpifort.exe \
            -DCMAKE_PREFIX_PATH=/ucrt64

      - name: Build once
        shell: msys2 {0}
        run: cmake --build build --parallel 2

      - name: Run default Windows configuration
        shell: msys2 {0}
        working-directory: BESLE_ROOT
        run: |
          rm -rf Results OOC
          mkdir -p Results OOC
          "/c/Program Files/Microsoft MPI/Bin/mpiexec.exe" -n 2 ../build/bin/BESLE.exe

      - name: Change load without rebuilding on Windows
        shell: msys2 {0}
        run: |
          rm -rf validation/modified-project
          mkdir -p validation/modified-project/Results validation/modified-project/OOC
          cp -r BESLE_ROOT/Body_forces BESLE_ROOT/Cracks BESLE_ROOT/Material \
            BESLE_ROOT/Mesh validation/modified-project/
          cp BESLE_ROOT/BESLE.nml validation/modified-project/BESLE.nml
          sed -i 's/1.0000000000000000d8/5.0000000000000000d7/' \
            validation/modified-project/BESLE.nml
          (
            cd validation/modified-project
            BESLE_CONFIG_FILE="$PWD/BESLE.nml" \
              "/c/Program Files/Microsoft MPI/Bin/mpiexec.exe" -n 2 ../../build/bin/BESLE.exe
          )
          if cmp -s BESLE_ROOT/Results/Results_1.vtk \
            validation/modified-project/Results/Results_1.vtk; then
            echo "Changing BESLE.nml did not change the Windows result." >&2
            exit 1
          fi

      - name: Download Linux references
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*-vtk
          path: references

      - name: Compare Windows default and modified cases against Linux
        shell: msys2 {0}
        run: |
          python tools/compare_vtk.py \
            references/linux-reference-vtk \
            BESLE_ROOT/Results \
            --rtol 1e-6 \
            --atol 1e-9 \
            --max-relative-l2 1e-10 \
            --report portability-windows-default.json
          python tools/compare_vtk.py \
            references/linux-modified-vtk \
            validation/modified-project/Results \
            --rtol 1e-6 \
            --atol 1e-9 \
            --max-relative-l2 1e-10 \
            --report portability-windows-modified.json

      - name: Record Windows environment
        if: always()
        shell: msys2 {0}
        run: |
          gfortran --version > environment-windows.txt
          cmake --version >> environment-windows.txt
          pacman -Q >> environment-windows.txt

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portability-evidence
          path: |
            BESLE_ROOT/Results/**/*.vtk
            validation/modified-project/Results/**/*.vtk
            validation/modified-project/BESLE.nml
            portability-windows-default.json
            portability-windows-modified.json
            environment-windows.txt
          if-no-files-found: warn
          retention-days: 14
