name: Portability CI

on:
  push:
    branches:
      - feature/windows-portability
      - feature/runtime-configuration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BESLE_MAX_STEPS: "1"
  BESLE_PORTABILITY_BASELINE: "78be7d93d60b85d8a66066f9b40c610461eb0b09"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  linux-reference:
    name: Linux reference and runtime configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran ninja-build \
            openmpi-bin libopenmpi-dev \
            libmumps-dev libscalapack-openmpi-dev \
            libopenblas-dev liblapack-dev

      - name: Configure current version
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=mpifort

      - name: Build current version once
        run: cmake --build build --parallel 2

      - name: Run default external configuration
        working-directory: BESLE_ROOT
        run: |
          rm -rf Results OOC
          mkdir -p Results OOC ../validation/default-results
          mpiexec -n 2 ../build/bin/BESLE
          cp Results/*.vtk ../validation/default-results/

      - name: Build published-code baseline
        run: |
          git worktree add baseline "$BESLE_PORTABILITY_BASELINE"
          cmake -S baseline -B baseline/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=mpifort
          cmake --build baseline/build --parallel 2

      - name: Verify default configuration against baseline
        run: |
          rm -rf baseline/BESLE_ROOT/Results baseline/BESLE_ROOT/OOC
          mkdir -p baseline/BESLE_ROOT/Results baseline/BESLE_ROOT/OOC
          (
            cd baseline/BESLE_ROOT
            mpiexec -n 2 ../build/bin/BESLE
          )
          python tools/compare_vtk.py \
            baseline/BESLE_ROOT/Results \
            validation/default-results \
            --rtol 0 \
            --atol 0 \
            --max-relative-l2 0 \
            --report validation/default-regression.json

      - name: Change load without rebuilding
        run: |
          rm -rf validation/modified-project
          mkdir -p validation/modified-project/Results validation/modified-project/OOC
          cp -r BESLE_ROOT/Body_forces BESLE_ROOT/Cracks BESLE_ROOT/Material \
            BESLE_ROOT/Mesh validation/modified-project/
          cp BESLE_ROOT/BESLE.nml validation/modified-project/BESLE.nml
          sed -i 's/1.0000000000000000d8/5.0000000000000000d7/' \
            validation/modified-project/BESLE.nml
          grep -q '5.0000000000000000d7' validation/modified-project/BESLE.nml
          (
            cd validation/modified-project
            BESLE_CONFIG_FILE="$PWD/BESLE.nml" mpiexec -n 2 ../../build/bin/BESLE
          )
          if cmp -s validation/default-results/Results_1.vtk \
            validation/modified-project/Results/Results_1.vtk; then
            echo "Changing BESLE.nml did not change the numerical result." >&2
            exit 1
          fi

      - name: Reject an invalid external configuration
        run: |
          rm -rf validation/invalid-project
          cp -r validation/modified-project validation/invalid-project
          rm -rf validation/invalid-project/Results validation/invalid-project/OOC
          mkdir -p validation/invalid-project/Results validation/invalid-project/OOC
          sed -i 's/dt = 9.9999999747524271d-7/dt = -1.0d-6/' \
            validation/invalid-project/BESLE.nml
          set +e
          (
            cd validation/invalid-project
            BESLE_CONFIG_FILE="$PWD/BESLE.nml" mpiexec -n 2 ../../build/bin/BESLE
          ) > validation/invalid-config.log 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "BESLE accepted an invalid negative time step." >&2
            exit 1
          fi
          grep -q 'ERROR DE CONFIGURACION BESLE' validation/invalid-config.log

      - name: Record Linux environment
        run: |
          gfortran --version > validation/environment-linux.txt
          cmake --version >> validation/environment-linux.txt
          mpiexec --version >> validation/environment-linux.txt
          dpkg-query -W gfortran openmpi-bin libopenmpi-dev libmumps-dev \
            libscalapack-openmpi-dev libopenblas-dev >> validation/environment-linux.txt

      - name: Upload Linux default reference
        uses: actions/upload-artifact@v4
        with:
          name: linux-reference-vtk
          path: validation/default-results/**/*.vtk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux modified reference
        uses: actions/upload-artifact@v4
        with:
          name: linux-modified-vtk
          path: validation/modified-project/Results/**/*.vtk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-configuration-evidence
          path: |
            validation/default-regression.json
            validation/modified-project/BESLE.nml
            validation/invalid-config.log
            validation/environment-linux.txt
          if-no-files-found: warn
          retention-days: 14

  windows-native:
    name: Windows native and equivalence
    needs: linux-reference
    runs-on: windows-2022
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Install Microsoft MPI runtime
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/a/5/2/a5207ca5-1203-491a-8fb8-906fd68ae623/msmpisetup.exe"
          $destination = Join-Path $env:RUNNER_TEMP "msmpisetup.exe"
          $expected = "C305CE3F05D142D519F8DD800D83A4B894FC31BCAD30512CEFB557FEACCBE8B4"
          Invoke-WebRequest -Uri $url -OutFile $destination
          $actual = (Get-FileHash -Path $destination -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Unexpected Microsoft MPI installer hash: $actual"
          }
          $process = Start-Process -FilePath $destination -ArgumentList "-unattend" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Microsoft MPI installation failed with exit code $($process.ExitCode)"
          }

      - name: Install UCRT64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            python
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-msmpi
            mingw-w64-ucrt-x86_64-mumps
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=/ucrt64/bin/mpifort.exe \
            -DCMAKE_PREFIX_PATH=/ucrt64

      - name: Build once
        shell: msys2 {0}
        run: cmake --build build --parallel 2

      - name: Run default Windows configuration
        shell: msys2 {0}
        working-directory: BESLE_ROOT
        run: |
          rm -rf Results OOC
          mkdir -p Results OOC
          "/c/Program Files/Microsoft MPI/Bin/mpiexec.exe" -n 2 ../build/bin/BESLE.exe

      - name: Change load without rebuilding on Windows
        shell: msys2 {0}
        run: |
          rm -rf validation/modified-project
          mkdir -p validation/modified-project/Results validation/modified-project/OOC
          cp -r BESLE_ROOT/Body_forces BESLE_ROOT/Cracks BESLE_ROOT/Material \
            BESLE_ROOT/Mesh validation/modified-project/
          cp BESLE_ROOT/BESLE.nml validation/modified-project/BESLE.nml
          sed -i 's/1.0000000000000000d8/5.0000000000000000d7/' \
            validation/modified-project/BESLE.nml
          (
            cd validation/modified-project
            BESLE_CONFIG_FILE="$PWD/BESLE.nml" \
              "/c/Program Files/Microsoft MPI/Bin/mpiexec.exe" -n 2 ../../build/bin/BESLE.exe
          )
          if cmp -s BESLE_ROOT/Results/Results_1.vtk \
            validation/modified-project/Results/Results_1.vtk; then
            echo "Changing BESLE.nml did not change the Windows result." >&2
            exit 1
          fi

      - name: Download Linux references
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*-vtk
          path: references

      - name: Compare Windows default and modified cases against Linux
        shell: msys2 {0}
        run: |
          python tools/compare_vtk.py \
            references/linux-reference-vtk \
            BESLE_ROOT/Results \
            --rtol 1e-6 \
            --atol 1e-9 \
            --max-relative-l2 1e-10 \
            --report portability-windows-default.json
          python tools/compare_vtk.py \
            references/linux-modified-vtk \
            validation/modified-project/Results \
            --rtol 1e-6 \
            --atol 1e-9 \
            --max-relative-l2 1e-10 \
            --report portability-windows-modified.json

      - name: Record Windows environment
        if: always()
        shell: msys2 {0}
        run: |
          gfortran --version > environment-windows.txt
          cmake --version >> environment-windows.txt
          pacman -Q >> environment-windows.txt

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portability-evidence
          path: |
            BESLE_ROOT/Results/**/*.vtk
            validation/modified-project/Results/**/*.vtk
            validation/modified-project/BESLE.nml
            portability-windows-default.json
            portability-windows-modified.json
            environment-windows.txt
          if-no-files-found: warn
          retention-days: 14
