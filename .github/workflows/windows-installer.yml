name: Windows Installer

on:
  push:
    branches:
      - feature/windows-portability
      - feature/runtime-configuration
  workflow_dispatch:

permissions:
  contents: read

env:
  BESLE_MAX_STEPS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  windows-installer:
    name: Build and validate unsigned installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Test MPI configuration reader with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $systemPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          & $systemPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/test_mpi_launcher.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "The MPI configuration reader tests failed."
          }

      - name: Download and install Microsoft MPI
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/a/5/2/a5207ca5-1203-491a-8fb8-906fd68ae623/msmpisetup.exe"
          $destination = Join-Path $env:RUNNER_TEMP "msmpisetup.exe"
          $expected = "C305CE3F05D142D519F8DD800D83A4B894FC31BCAD30512CEFB557FEACCBE8B4"
          Invoke-WebRequest -Uri $url -OutFile $destination
          $actual = (Get-FileHash -Path $destination -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Unexpected Microsoft MPI installer hash: $actual"
          }
          $process = Start-Process -FilePath $destination -ArgumentList "-unattend" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Microsoft MPI installation failed with exit code $($process.ExitCode)"
          }

      - name: Install UCRT64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            python
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-msmpi
            mingw-w64-ucrt-x86_64-mumps
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure native Windows build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=/ucrt64/bin/mpifort.exe \
            -DCMAKE_PREFIX_PATH=/ucrt64

      - name: Build native Windows executable
        shell: msys2 {0}
        run: cmake --build build --parallel 2

      - name: Run pre-install reference
        shell: msys2 {0}
        working-directory: BESLE_ROOT
        run: |
          rm -rf Results OOC
          mkdir -p Results OOC
          "/c/Program Files/Microsoft MPI/Bin/mpiexec.exe" -n 2 ../build/bin/BESLE.exe

      - name: Stage application
        shell: msys2 {0}
        run: |
          rm -rf packaging/windows/stage dist packaging-tests
          cmake --install build --prefix packaging/windows/stage
          mkdir -p packaging/windows/stage/redist packaging-tests
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          cp "$runner_temp/msmpisetup.exe" packaging/windows/stage/redist/msmpisetup.exe

      - name: Bundle native runtime DLLs and licenses
        shell: msys2 {0}
        run: |
          : > runtime-dependencies.txt
          mapfile -t executables < <(
            find packaging/windows/stage -maxdepth 1 -type f -iname '*.exe' | sort
          )
          if [[ ${#executables[@]} -lt 5 ]]; then
            echo "The staged package is missing one or more BESLE executables." >&2
            exit 1
          fi
          for executable in "${executables[@]}"; do
            printf '\n[%s]\n' "$executable" >> runtime-dependencies.txt
            ldd "$executable" >> runtime-dependencies.txt
          done
          cat runtime-dependencies.txt

          if grep -qi "not found" runtime-dependencies.txt; then
            echo "A runtime dependency could not be resolved." >&2
            exit 1
          fi

          if grep -Eq "=> /(usr|mingw32|mingw64|clang32|clang64)/" runtime-dependencies.txt; then
            echo "The executable unexpectedly depends on a non-UCRT64 MSYS2 runtime." >&2
            exit 1
          fi

          mapfile -t runtime_dlls < <(
            awk '/=> \/ucrt64\/bin\// {print $3}' runtime-dependencies.txt | sort -u
          )

          if [[ ${#runtime_dlls[@]} -eq 0 ]]; then
            echo "No UCRT64 runtime DLLs were detected." >&2
            exit 1
          fi

          cp "${runtime_dlls[@]}" packaging/windows/stage/
          bash tools/stage_msys2_licenses.sh packaging/windows/stage

          sha256sum \
            packaging/windows/stage/*.exe \
            packaging/windows/stage/*.dll \
            packaging/windows/stage/redist/msmpisetup.exe \
            > packaging/windows/stage/BUNDLED-FILES.sha256

      - name: Verify staged folder creation without running BESLE
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "packaging\windows\stage"
          $outputRoot = Join-Path $env:RUNNER_TEMP "besle-staged-create-only"
          $systemPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem"),
            (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
          ) -join ";"
          $launcherArguments = @(
            "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", (Join-Path $stage "run-besle.ps1"),
            "-Mode", "Create", "-OutputRoot", $outputRoot, "-NoPause"
          )

          $stagedExecutable = Join-Path $stage "BESLE.exe"
          $heldExecutable = Join-Path $stage "BESLE.exe.not-running"
          Move-Item -LiteralPath $stagedExecutable -Destination $heldExecutable
          try {
            & $systemPowerShell @launcherArguments
            $launcherExitCode = $LASTEXITCODE
          }
          finally {
            Move-Item -LiteralPath $heldExecutable -Destination $stagedExecutable
          }
          if ($launcherExitCode -ne 0) {
            throw "The staged create-only launcher failed with exit code $launcherExitCode"
          }

          $resultDirectory = Get-ChildItem -LiteralPath $outputRoot -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $resultDirectory) {
            throw "The staged launcher did not create a simulation directory."
          }
          foreach ($requiredFile in @("BESLE.nml", "run-this-simulation.cmd")) {
            if (-not (Test-Path -LiteralPath (Join-Path $resultDirectory.FullName $requiredFile) -PathType Leaf)) {
              throw "The staged project is missing $requiredFile."
            }
          }
          foreach ($requiredDirectory in @("Body_forces", "Cracks", "Material", "Mesh")) {
            if (-not (Test-Path -LiteralPath (Join-Path $resultDirectory.FullName $requiredDirectory) -PathType Container)) {
              throw "The staged project is missing $requiredDirectory."
            }
          }
          $auxiliaryFiles = @(
            "Material\Material.nml",
            "Material\run-material.cmd",
            "Mesh\General\General.nml",
            "Mesh\General\run-general.cmd",
            "Mesh\Polycrystal\Polycrystal.nml",
            "Mesh\Polycrystal\run-polycrystal.cmd"
          )
          foreach ($relativeFile in $auxiliaryFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $resultDirectory.FullName $relativeFile) -PathType Leaf)) {
              throw "The staged project is missing $relativeFile."
            }
          }
          foreach ($unexpectedFile in @("BESLE.log", "BESLE-used.nml", "edit-BESLE-parameters.cmd")) {
            if (Test-Path -LiteralPath (Join-Path $resultDirectory.FullName $unexpectedFile)) {
              throw "Create-only mode unexpectedly generated $unexpectedFile."
            }
          }
          $unexpectedVtk = @(Get-ChildItem -LiteralPath $resultDirectory.FullName -Filter "Results_*.vtk" -File -Recurse)
          if ($unexpectedVtk.Count -ne 0) {
            throw "Create-only mode unexpectedly generated VTK results."
          }

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup compiler was not found."
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile unsigned installer
        shell: pwsh
        run: |
          & $env:ISCC_PATH "packaging\windows\BESLE.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = "dist\BESLE-2.1.0-Windows-x64-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "The expected installer was not generated."
          }

      - name: Remove build-time Microsoft MPI
        shell: pwsh
        run: |
          $mpiInstaller = Join-Path $env:RUNNER_TEMP "msmpisetup.exe"
          $process = Start-Process -FilePath $mpiInstaller -ArgumentList @("-uninstall", "-unattend") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Microsoft MPI removal failed with exit code $($process.ExitCode)"
          }

          $mpiExecutable = Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "Microsoft MPI\Bin\mpiexec.exe"
          if (Test-Path -LiteralPath $mpiExecutable) {
            throw "Microsoft MPI remained installed, so the clean installer test is invalid."
          }

      - name: Install package on clean runtime
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist\BESLE-2.1.0-Windows-x64-Setup.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "besle-clean-install"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installDirectory"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "BESLE installation failed with exit code $($process.ExitCode)"
          }

          $mpiExecutable = Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "Microsoft MPI\Bin\mpiexec.exe"
          if (-not (Test-Path -LiteralPath $mpiExecutable -PathType Leaf)) {
            throw "The BESLE installer did not restore the required Microsoft MPI runtime."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDirectory "BESLE.exe") -PathType Leaf)) {
            throw "BESLE.exe was not installed."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDirectory "BESLE.nml") -PathType Leaf)) {
            throw "The editable BESLE.nml template was not installed."
          }
          $installedAuxiliaryFiles = @(
            "BESLE-Material.exe",
            "BESLE-General.exe",
            "BESLE-Polycrystal-Structure.exe",
            "BESLE-Polycrystal-Mesh.exe",
            "run-besle-auxiliary.ps1",
            "Material\Material.nml",
            "Mesh\General\General.nml",
            "Mesh\Polycrystal\Polycrystal.nml"
          )
          foreach ($relativeFile in $installedAuxiliaryFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDirectory $relativeFile) -PathType Leaf)) {
              throw "The installed package is missing $relativeFile."
            }
          }

          "BESLE_TEST_INSTALL_DIR=$installDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $executableHash = (Get-FileHash -LiteralPath (Join-Path $installDirectory "BESLE.exe") -Algorithm SHA256).Hash
          "BESLE_INSTALLED_EXE_HASH=$executableHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create installed project without running the default case
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "besle-installed-create-only"
          $systemPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $launcherArguments = @(
            "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", (Join-Path $env:BESLE_TEST_INSTALL_DIR "run-besle.ps1"),
            "-Mode", "Create", "-OutputRoot", $outputRoot, "-NoPause"
          )

          & $systemPowerShell @launcherArguments
          if ($LASTEXITCODE -ne 0) {
            throw "The installed create-only launcher failed with exit code $LASTEXITCODE"
          }

          $project = Get-ChildItem -LiteralPath $outputRoot -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $project) {
            throw "Create-only mode did not create an installed simulation project."
          }
          foreach ($requiredFile in @("BESLE.nml", "run-this-simulation.cmd")) {
            if (-not (Test-Path -LiteralPath (Join-Path $project.FullName $requiredFile) -PathType Leaf)) {
              throw "The installed create-only project is missing $requiredFile."
            }
          }
          foreach ($unexpectedFile in @("BESLE.log", "BESLE-used.nml", "edit-BESLE-parameters.cmd")) {
            if (Test-Path -LiteralPath (Join-Path $project.FullName $unexpectedFile)) {
              throw "Create-only mode unexpectedly generated $unexpectedFile."
            }
          }
          $unexpectedVtk = @(Get-ChildItem -LiteralPath $project.FullName -Filter "Results_*.vtk" -File -Recurse)
          if ($unexpectedVtk.Count -ne 0) {
            throw "Create-only mode unexpectedly generated VTK results."
          }

          $currentHash = (Get-FileHash -LiteralPath (Join-Path $env:BESLE_TEST_INSTALL_DIR "BESLE.exe") -Algorithm SHA256).Hash
          if ($currentHash -ne $env:BESLE_INSTALLED_EXE_HASH) {
            throw "BESLE.exe changed while creating an unexecuted project."
          }

          "BESLE_CREATE_ONLY_PROJECT=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run and reconfigure all installed auxiliary tools
        shell: pwsh
        run: |
          $project = $env:BESLE_CREATE_ONLY_PROJECT
          $commandInterpreter = Join-Path $env:SystemRoot "System32\cmd.exe"
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem"),
            (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
          ) -join ";"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          function Invoke-GeneratedHelper {
            param([string]$Directory, [string]$FileName)
            Push-Location $Directory
            try {
              & $commandInterpreter /d /c "$FileName < nul"
              $exitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
            if ($exitCode -ne 0) {
              throw "$FileName failed with exit code $exitCode"
            }
          }

          $auxiliaryExecutables = @(
            "BESLE-Material.exe",
            "BESLE-General.exe",
            "BESLE-Polycrystal-Structure.exe",
            "BESLE-Polycrystal-Mesh.exe"
          )
          $hashesBefore = @{}
          foreach ($name in $auxiliaryExecutables) {
            $hashesBefore[$name] = (Get-FileHash -LiteralPath (Join-Path $env:BESLE_TEST_INSTALL_DIR $name) -Algorithm SHA256).Hash
          }

          $material = Join-Path $project "Material"
          Invoke-GeneratedHelper -Directory $material -FileName "run-material.cmd"
          $materialOutput = Join-Path $material "Data\Isotropic\Material_9.dat"
          $materialDefaultHash = (Get-FileHash -LiteralPath $materialOutput -Algorithm SHA256).Hash
          $materialConfig = Join-Path $material "Material.nml"
          $text = [IO.File]::ReadAllText($materialConfig)
          $modified = $text.Replace("2.0000000000000000d5", "1.0000000000000000d5")
          if ($modified -eq $text) { throw "Material.nml did not contain the expected E value." }
          [IO.File]::WriteAllText($materialConfig, $modified, $utf8NoBom)
          Invoke-GeneratedHelper -Directory $material -FileName "run-material.cmd"
          if ((Get-FileHash -LiteralPath $materialOutput -Algorithm SHA256).Hash -eq $materialDefaultHash) {
            throw "Editing Material.nml did not change Material_9.dat."
          }
          if (@(Get-ChildItem -LiteralPath (Join-Path $material "history") -Filter "Material_9.dat" -File -Recurse).Count -eq 0) {
            throw "The previous material output was not archived."
          }

          $general = Join-Path $project "Mesh\General"
          Invoke-GeneratedHelper -Directory $general -FileName "run-general.cmd"
          $generalOutput = Join-Path $general "BCs\BCs_DAT\BCs_2.dat"
          $generalDefaultHash = (Get-FileHash -LiteralPath $generalOutput -Algorithm SHA256).Hash
          $generalConfig = Join-Path $general "General.nml"
          $text = [IO.File]::ReadAllText($generalConfig)
          $modified = $text.Replace("1.0d2", "5.0d1")
          if ($modified -eq $text) { throw "General.nml did not contain the expected traction value." }
          [IO.File]::WriteAllText($generalConfig, $modified, $utf8NoBom)
          Invoke-GeneratedHelper -Directory $general -FileName "run-general.cmd"
          if ((Get-FileHash -LiteralPath $generalOutput -Algorithm SHA256).Hash -eq $generalDefaultHash) {
            throw "Editing General.nml did not change BCs_2.dat."
          }
          if (@(Get-ChildItem -LiteralPath (Join-Path $general "history") -Filter "BCs_2.dat" -File -Recurse).Count -eq 0) {
            throw "The previous general-mesh output was not archived."
          }

          $polycrystal = Join-Path $project "Mesh\Polycrystal"
          $polyConfig = Join-Path $polycrystal "Polycrystal.nml"
          $text = [IO.File]::ReadAllText($polyConfig)
          $text = $text.Replace("ngrains_x = 3", "ngrains_x = 2")
          $text = $text.Replace("ngrains_y = 4", "ngrains_y = 1")
          $text = $text.Replace("ngrains_z = 8", "ngrains_z = 1")
          [IO.File]::WriteAllText($polyConfig, $text, $utf8NoBom)
          Invoke-GeneratedHelper -Directory $polycrystal -FileName "run-polycrystal.cmd"
          $polyOutput = Join-Path $polycrystal "Export\Mesh.dat"
          $polyDefaultHash = (Get-FileHash -LiteralPath $polyOutput -Algorithm SHA256).Hash
          $text = [IO.File]::ReadAllText($polyConfig)
          $modified = $text.Replace("x_max = 15.0", "x_max = 12.0")
          if ($modified -eq $text) { throw "Polycrystal.nml did not contain the expected x_max value." }
          [IO.File]::WriteAllText($polyConfig, $modified, $utf8NoBom)
          Invoke-GeneratedHelper -Directory $polycrystal -FileName "run-polycrystal.cmd"
          if ((Get-FileHash -LiteralPath $polyOutput -Algorithm SHA256).Hash -eq $polyDefaultHash) {
            throw "Editing Polycrystal.nml did not change Mesh.dat."
          }
          if (@(Get-ChildItem -LiteralPath (Join-Path $polycrystal "history") -Filter "Mesh.dat" -File -Recurse).Count -eq 0) {
            throw "The previous polycrystal output was not archived."
          }

          foreach ($name in $auxiliaryExecutables) {
            $currentHash = (Get-FileHash -LiteralPath (Join-Path $env:BESLE_TEST_INSTALL_DIR $name) -Algorithm SHA256).Hash
            if ($currentHash -ne $hashesBefore[$name]) {
              throw "$name changed while editing runtime configuration."
            }
          }

          foreach ($tool in @("Material", "General", "Polycrystal")) {
            $toolDirectory = switch ($tool) {
              "Material" { $material }
              "General" { $general }
              "Polycrystal" { $polycrystal }
            }
            foreach ($suffix in @("$tool-used.nml", "$tool.log")) {
              if (-not (Test-Path -LiteralPath (Join-Path $toolDirectory $suffix) -PathType Leaf)) {
                throw "$tool did not preserve $suffix."
              }
            }
          }

          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "packaging-tests\auxiliary-runtime"
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $evidenceFiles = @(
            $materialConfig,
            (Join-Path $material "Material-used.nml"),
            (Join-Path $material "Material.log"),
            $materialOutput,
            $generalConfig,
            (Join-Path $general "General-used.nml"),
            (Join-Path $general "General.log"),
            $generalOutput,
            $polyConfig,
            (Join-Path $polycrystal "Polycrystal-used.nml"),
            (Join-Path $polycrystal "Polycrystal.log"),
            $polyOutput,
            (Join-Path $polycrystal "Export\Mesh.vtk")
          )
          foreach ($path in $evidenceFiles) {
            Copy-Item -LiteralPath $path -Destination $evidenceRoot
          }

          "BESLE_AUX_MATERIAL_OUTPUT=$materialOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BESLE_AUX_GENERAL_OUTPUT=$generalOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BESLE_AUX_POLY_OUTPUT=$polyOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run installed application without build tools on PATH
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "besle-installed-run"
          $systemPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem"),
            (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
          ) -join ";"
          $launcherArguments = @(
            "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", (Join-Path $env:BESLE_TEST_INSTALL_DIR "run-besle.ps1"),
            "-Mode", "Quick", "-OutputRoot", $outputRoot, "-NoPause"
          )

          & $systemPowerShell @launcherArguments
          if ($LASTEXITCODE -ne 0) {
            throw "The installed launcher failed with exit code $LASTEXITCODE"
          }

          $runDirectory = Get-ChildItem -LiteralPath $outputRoot -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $runDirectory) {
            throw "The installed launcher did not create a run directory."
          }

          $results = Join-Path $runDirectory.FullName "Results"
          $vtk = @(Get-ChildItem -LiteralPath $results -Filter "Results_*.vtk" -File)
          if ($vtk.Count -eq 0) {
            throw "The installed application did not generate a VTK result."
          }

          $evidence = Join-Path $env:GITHUB_WORKSPACE "packaging-tests\installed-results"
          Copy-Item -LiteralPath $results -Destination $evidence -Recurse
          Copy-Item -LiteralPath (Join-Path $runDirectory.FullName "BESLE.log") -Destination (Join-Path $env:GITHUB_WORKSPACE "packaging-tests\installed-BESLE.log")

          "BESLE_USER_PROJECT=$($runDirectory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compare packaged result with pre-install result
        shell: msys2 {0}
        run: |
          python tools/compare_vtk.py \
            BESLE_ROOT/Results \
            packaging-tests/installed-results \
            --rtol 1e-12 \
            --atol 1e-12 \
            --report packaged-windows.json

      - name: Edit project configuration and rerun installed executable
        shell: pwsh
        run: |
          $project = $env:BESLE_USER_PROJECT
          $config = Join-Path $project "BESLE.nml"
          $original = [IO.File]::ReadAllText($config)
          $modified = $original.Replace("1.0000000000000000d8", "5.0000000000000000d7")
          if ($modified -eq $original) {
            throw "The reference load was not found in BESLE.nml."
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($config, $modified, $utf8NoBom)

          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem"),
            (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
          ) -join ";"
          $helper = Join-Path $project "run-this-simulation.cmd"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "The generated rerun helper was not found."
          }
          $commandInterpreter = Join-Path $env:SystemRoot "System32\cmd.exe"
          Push-Location $project
          try {
            & $commandInterpreter /d /c "run-this-simulation.cmd < nul"
            $helperExitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          if ($helperExitCode -ne 0) {
            throw "Rerunning through the generated helper failed with exit code $helperExitCode"
          }

          $currentHash = (Get-FileHash -LiteralPath (Join-Path $env:BESLE_TEST_INSTALL_DIR "BESLE.exe") -Algorithm SHA256).Hash
          if ($currentHash -ne $env:BESLE_INSTALLED_EXE_HASH) {
            throw "BESLE.exe changed while editing runtime parameters."
          }

          $archive = Get-ChildItem -LiteralPath (Join-Path $project "history") -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $archive) {
            throw "The previous run was not archived."
          }

          $oldVtk = @(Get-ChildItem -LiteralPath (Join-Path $archive.FullName "Results") -Filter "Results_*.vtk" -File)
          $newVtk = @(Get-ChildItem -LiteralPath (Join-Path $project "Results") -Filter "Results_*.vtk" -File)
          if (($oldVtk.Count -eq 0) -or ($newVtk.Count -eq 0)) {
            throw "The before/after VTK evidence is incomplete."
          }
          if ((Get-FileHash -LiteralPath $oldVtk[0].FullName -Algorithm SHA256).Hash -eq
              (Get-FileHash -LiteralPath $newVtk[0].FullName -Algorithm SHA256).Hash) {
            throw "Editing BESLE.nml did not change the installed simulation result."
          }

          $usedConfig = Join-Path $project "BESLE-used.nml"
          if ((Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $usedConfig -Algorithm SHA256).Hash) {
            throw "BESLE-used.nml does not match the configuration used for the rerun."
          }

          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "packaging-tests\runtime-edit"
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          Copy-Item -LiteralPath $config -Destination (Join-Path $evidenceRoot "BESLE.nml")
          Copy-Item -LiteralPath $usedConfig -Destination (Join-Path $evidenceRoot "BESLE-used.nml")
          Copy-Item -LiteralPath (Join-Path $project "BESLE.log") -Destination (Join-Path $evidenceRoot "BESLE.log")
          Copy-Item -LiteralPath (Join-Path $project "Results") -Destination (Join-Path $evidenceRoot "modified-results") -Recurse
          Copy-Item -LiteralPath (Join-Path $archive.FullName "Results") -Destination (Join-Path $evidenceRoot "previous-results") -Recurse

          "BESLE_USER_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BESLE_USER_VTK=$($newVtk[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BESLE_USER_HISTORY_VTK=$($oldVtk[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Choose MPI counts through the installed project helper
        shell: pwsh
        run: |
          $project = $env:BESLE_USER_PROJECT
          $config = Join-Path $project "BESLE.nml"
          $original = [IO.File]::ReadAllText($config)
          $oneStep = $original.Replace("time_steps = 200", "time_steps = 1")
          if ($oneStep -eq $original) {
            throw "The reference time_steps setting was not found."
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $commandInterpreter = Join-Path $env:SystemRoot "System32\cmd.exe"
          $pythonExecutable = (Get-Command python.exe).Source
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "packaging-tests\mpi-processes"
          [void](New-Item -ItemType Directory -Path $evidenceRoot -Force)
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem"),
            (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
          ) -join ";"

          function Invoke-ProjectHelper {
            Push-Location $project
            try {
              & $commandInterpreter /d /c "run-this-simulation.cmd < nul"
              $helperExitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
            if ($helperExitCode -ne 0) {
              throw "The generated helper failed with exit code $helperExitCode"
            }
          }

          # Older projects omit mpi_processes and must still launch two ranks.
          $legacy = [regex]::Replace($oneStep, '(?im)^[ \t]*mpi_processes[ \t]*=[ \t]*2[ \t]*\r?\n', '')
          if ($legacy -eq $oneStep) {
            throw "The default mpi_processes setting was not found."
          }
          [IO.File]::WriteAllText($config, $legacy, $utf8NoBom)
          Invoke-ProjectHelper
          $log = Join-Path $project "BESLE.log"
          if (-not (Select-String -LiteralPath $log -Pattern '^Procesos MPI activos: 2$' -Quiet)) {
            throw "A legacy project did not launch two MPI processes."
          }
          $reference = Join-Path $evidenceRoot "two-process-reference"
          Copy-Item -LiteralPath (Join-Path $project "Results") -Destination $reference -Recurse
          Copy-Item -LiteralPath $config -Destination (Join-Path $evidenceRoot "legacy-BESLE.nml")
          Copy-Item -LiteralPath $log -Destination (Join-Path $evidenceRoot "legacy-BESLE.log")

          # Two/four ranks are mandatory acceptance. Eight ranks are probed in
          # an isolated project below because this runner can run out of memory.
          foreach ($processes in @(4)) {
            $selected = $oneStep.Replace("mpi_processes = 2", "mpi_processes = $processes")
            [IO.File]::WriteAllText($config, $selected, $utf8NoBom)
            Invoke-ProjectHelper
            if (-not (Select-String -LiteralPath $log -Pattern "^Procesos MPI activos: $processes`$" -Quiet)) {
              throw "The helper did not launch the requested $processes MPI processes."
            }
            $results = Join-Path $evidenceRoot "$processes-process-results"
            Copy-Item -LiteralPath (Join-Path $project "Results") -Destination $results -Recurse
            Copy-Item -LiteralPath (Join-Path $project "BESLE-used.nml") -Destination (Join-Path $evidenceRoot "$processes-BESLE-used.nml")
            Copy-Item -LiteralPath $log -Destination (Join-Path $evidenceRoot "$processes-BESLE.log")
            & $pythonExecutable (Join-Path $env:GITHUB_WORKSPACE "tools\compare_vtk.py") `
              $reference $results --rtol 1e-6 --atol 1e-9 --max-relative-l2 1e-10 `
              --report (Join-Path $evidenceRoot "$processes-comparison.json")
            if ($LASTEXITCODE -ne 0) {
              throw "Changing the MPI count failed the numerical equivalence criterion."
            }
          }

          # Invalid counts must not replace a log/result or archive anything.
          $validConfiguration = [IO.File]::ReadAllText($config)
          $protectedFiles = @($log, (Join-Path $project "BESLE-used.nml"), (Join-Path $project "Results\Results.vtk"))
          $protectedHashes = @($protectedFiles | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash }) -join ":"
          $historyCount = @(Get-ChildItem -LiteralPath (Join-Path $project "history") -Directory).Count
          foreach ($value in @("0", "1", "-2", "4.5", "four", "2147483648")) {
            $invalid = $oneStep.Replace("mpi_processes = 2", "mpi_processes = $value")
            [IO.File]::WriteAllText($config, $invalid, $utf8NoBom)
            Push-Location $project
            try {
              & $commandInterpreter /d /c "run-this-simulation.cmd < nul"
              $helperExitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
            if ($helperExitCode -eq 0) {
              throw "The helper accepted the invalid MPI count $value."
            }
            $currentHashes = @($protectedFiles | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash }) -join ":"
            $currentHistoryCount = @(Get-ChildItem -LiteralPath (Join-Path $project "history") -Directory).Count
            if (($currentHashes -ne $protectedHashes) -or ($currentHistoryCount -ne $historyCount)) {
              throw "An invalid MPI count modified or archived existing outputs."
            }
          }
          [IO.File]::WriteAllText($config, $validConfiguration, $utf8NoBom)
          $currentHash = (Get-FileHash -LiteralPath (Join-Path $env:BESLE_TEST_INSTALL_DIR "BESLE.exe") -Algorithm SHA256).Hash
          if ($currentHash -ne $env:BESLE_INSTALLED_EXE_HASH) {
            throw "BESLE.exe changed while selecting MPI counts."
          }
          "BESLE_USER_VTK=$(Join-Path $project 'Results\Results.vtk')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Validated 2 (legacy) and 4 MPI processes; invalid counts preserved outputs. See eight-process-probe.json for the separate eight-rank diagnostic." |
            Out-File -FilePath (Join-Path $evidenceRoot "acceptance.txt") -Encoding utf8
          # Rejected native commands intentionally returned nonzero. Only report
          # success after every count, result, hash and history assertion passed.
          exit 0

      - name: Probe eight MPI processes without hiding resource limits
        shell: pwsh
        run: |
          $systemPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $commandInterpreter = Join-Path $env:SystemRoot "System32\cmd.exe"
          $pythonExecutable = (Get-Command python.exe).Source
          $outputRoot = Join-Path $env:RUNNER_TEMP "besle-eight-process-probe"
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "packaging-tests\mpi-processes"
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem"),
            (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
          ) -join ";"
          & $systemPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File (Join-Path $env:BESLE_TEST_INSTALL_DIR "run-besle.ps1") `
            -Mode Create -OutputRoot $outputRoot -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Could not create the isolated eight-rank project." }
          $project = Get-ChildItem -LiteralPath $outputRoot -Directory | Select-Object -First 1
          if ($null -eq $project) { throw "The eight-rank project was not created." }

          # Use the same inputs/configuration as the two/four-rank comparison,
          # but never replace the mandatory acceptance project's results.
          $selected = [IO.File]::ReadAllText((Join-Path $env:BESLE_USER_PROJECT "BESLE.nml"))
          $selected = [regex]::Replace($selected, '(?im)^([ \t]*mpi_processes[ \t]*=[ \t]*)4\b', '${1}8')
          if ($selected -notmatch '(?im)^[ \t]*mpi_processes[ \t]*=[ \t]*8\b') {
            throw "The probe did not select eight processes."
          }
          $config = Join-Path $project.FullName "BESLE.nml"
          [IO.File]::WriteAllText($config, $selected, (New-Object System.Text.UTF8Encoding($false)))
          Push-Location $project.FullName
          try {
            & $commandInterpreter /d /c "run-this-simulation.cmd < nul"
            $probeExitCode = $LASTEXITCODE
          }
          finally { Pop-Location }

          $log = Join-Path $project.FullName "BESLE.log"
          $logText = [IO.File]::ReadAllText($log)
          if ($logText -notmatch '(?m)^Procesos MPI activos: 8\r?$') {
            throw "The probe did not actually start eight MPI processes."
          }
          Copy-Item -LiteralPath $config -Destination (Join-Path $evidenceRoot "8-BESLE.nml")
          Copy-Item -LiteralPath $log -Destination (Join-Path $evidenceRoot "8-BESLE.log")
          $record = [ordered]@{
            requested_processes = 8
            actual_processes_confirmed = 8
            helper_exit_code = $probeExitCode
            numerical_equivalence_passed = $false
            status = "not_validated"
          }

          if ($probeExitCode -eq 0) {
            $results = Join-Path $evidenceRoot "8-process-results"
            Copy-Item -LiteralPath (Join-Path $project.FullName "Results") -Destination $results -Recurse
            & $pythonExecutable (Join-Path $env:GITHUB_WORKSPACE "tools\compare_vtk.py") `
              (Join-Path $evidenceRoot "two-process-reference") $results `
              --rtol 1e-6 --atol 1e-9 --max-relative-l2 1e-10 `
              --report (Join-Path $evidenceRoot "8-comparison.json")
            if ($LASTEXITCODE -ne 0) { throw "Eight-rank numerical equivalence failed." }
            $record.status = "passed"
            $record.numerical_equivalence_passed = $true
          }
          else {
            # Only the specifically observed MUMPS allocation failure is a
            # resource-limited diagnostic, never a successful simulation.
            $globalErrors = [regex]::Matches($logText, 'INFOG\(1\)\s*=\s*(-\d+)')
            if (($globalErrors.Count -eq 0) -or
                @($globalErrors | Where-Object { $_.Groups[1].Value -ne '-13' }).Count -gt 0) {
              throw "The eight-rank probe failed for a reason other than MUMPS allocation error -13."
            }
            $record.status = "resource_limited_not_validated"
            $record.mumps_error = -13
            $record.explanation = "MUMPS could not allocate workspace on this Windows runner. Eight-process simulation is not certified; no fallback or solver change was applied."
            Write-Warning $record.explanation
          }
          $record | ConvertTo-Json | Out-File -FilePath (Join-Path $evidenceRoot "eight-process-probe.json") -Encoding utf8
          $summary = "Eight MPI processes: $($record.status). Numerical equivalence passed: $($record.numerical_equivalence_passed)."
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 0

      - name: Uninstall BESLE and preserve user results
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:BESLE_TEST_INSTALL_DIR "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "The BESLE uninstaller was not found."
          }

          $uninstallArguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          $process = Start-Process -FilePath $uninstaller -ArgumentList $uninstallArguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "BESLE removal failed with exit code $($process.ExitCode)"
          }
          if (Test-Path -LiteralPath $env:BESLE_TEST_INSTALL_DIR) {
            throw "The BESLE installation directory remained after uninstall."
          }
          if (-not (Test-Path -LiteralPath $env:BESLE_USER_VTK -PathType Leaf)) {
            throw "Uninstalling BESLE removed a user result."
          }
          if (-not (Test-Path -LiteralPath $env:BESLE_USER_HISTORY_VTK -PathType Leaf)) {
            throw "Uninstalling BESLE removed archived user results."
          }
          if (-not (Test-Path -LiteralPath $env:BESLE_USER_CONFIG -PathType Leaf)) {
            throw "Uninstalling BESLE removed the user's BESLE.nml."
          }
          foreach ($auxiliaryOutput in @(
            $env:BESLE_AUX_MATERIAL_OUTPUT,
            $env:BESLE_AUX_GENERAL_OUTPUT,
            $env:BESLE_AUX_POLY_OUTPUT
          )) {
            if (-not (Test-Path -LiteralPath $auxiliaryOutput -PathType Leaf)) {
              throw "Uninstalling BESLE removed an auxiliary user output: $auxiliaryOutput"
            }
          }

      - name: Record installer evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $installer = "dist\BESLE-2.1.0-Windows-x64-Setup.exe"
          if (Test-Path -LiteralPath $installer -PathType Leaf) {
            $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *BESLE-2.1.0-Windows-x64-Setup.exe" | Set-Content -Path "dist\BESLE-2.1.0-Windows-x64-Setup.exe.sha256" -Encoding ascii
          }

          $record = @(
            "Git commit: $env:GITHUB_SHA",
            "Runner: $env:RUNNER_NAME",
            "Operating system: $([Environment]::OSVersion.VersionString)",
            "PowerShell: $($PSVersionTable.PSVersion)",
            "Microsoft MPI installer SHA256: C305CE3F05D142D519F8DD800D83A4B894FC31BCAD30512CEFB557FEACCBE8B4"
          )
          if ($env:ISCC_PATH -and (Test-Path -LiteralPath $env:ISCC_PATH)) {
            $record += "Inno Setup: $((Get-Item $env:ISCC_PATH).VersionInfo.FileVersion)"
          }
          $record | Set-Content -Path "dist\environment-windows-installer.txt" -Encoding utf8

      - name: Upload installer and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: besle-2.1.0-windows-x64
          path: |
            dist/BESLE-2.1.0-Windows-x64-Setup.exe
            dist/BESLE-2.1.0-Windows-x64-Setup.exe.sha256
            dist/environment-windows-installer.txt
            packaged-windows.json
            runtime-dependencies.txt
            packaging/windows/stage/BUNDLED-FILES.sha256
            packaging/windows/stage/third-party-licenses/
            packaging-tests/installed-results/**/*.vtk
            packaging-tests/installed-BESLE.log
            packaging-tests/runtime-edit/
            packaging-tests/auxiliary-runtime/
            packaging-tests/mpi-processes/
          if-no-files-found: warn
          retention-days: 14
